<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="cpdsCnJIDGdDF-Sr7KEiRvshKrnx0Y46h-MDzlaNYoU" />
    
    <!-- Primary Meta Tags -->
    <title>AniQuiz AI - The Ultimate Anime Trivia Challenge</title>
    <meta name="title" content="AniQuiz AI - The Ultimate Anime Trivia Challenge" />
    <meta name="description" content="Play the ultimate AI-powered anime quiz game! Challenge friends in multiplayer battles, test your otaku level with infinite trivia questions, play story mode, and collect characters in the Gacha system. Features questions from Naruto, One Piece, Dragon Ball, Attack on Titan, and hundreds more. Powered by Google Gemini AI." />
    <meta name="keywords" content="anime quiz, anime trivia, otaku test, guess the anime, anime character quiz, manga quiz, ai generated quiz, gemini ai, multiplayer anime game, anime knowledge test, naruto quiz, one piece quiz, dragon ball quiz, attack on titan trivia, anime arcade, anime mini games, visual novel story mode, anime gacha, online anime quiz, anime party game" />
    <meta name="author" content="AniQuiz AI Team" />
    <meta name="theme-color" content="#6366f1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aniquizes.vercel.app/" />
    <meta property="og:title" content="AniQuiz AI - Infinite Anime Trivia" />
    <meta property="og:description" content="Battle friends or play solo in the most advanced AI-powered anime quiz game. Ranked modes, mini-games, and more!" />
    <meta property="og:image" content="https://aniquizes.vercel.app/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://aniquizes.vercel.app/" />
    <meta property="twitter:title" content="AniQuiz AI - Infinite Anime Trivia" />
    <meta property="twitter:description" content="Battle friends or play solo in the most advanced AI-powered anime quiz game." />
    <meta property="twitter:image" content="https://aniquizes.vercel.app/og-image.jpg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "AniQuiz AI",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "An AI-powered anime quiz application featuring multiplayer modes, RPG story elements, and dynamic question generation."
    }
    </script>

    <!-- Tailwind CSS CDN is kept for simplicity, though installation via package.json is also an option -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              anime: {
                dark: '#0f172a',
                card: '#1e293b',
                primary: '#6366f1',
                secondary: '#a855f7',
                accent: '#ec4899',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              arabic: ['Tajawal', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
              'shake': 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both',
              'shimmer': 'shimmer 2s infinite linear',
              'scale-in': 'scaleIn 0.3s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              pop: {
                '0%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.2)' },
                '100%': { transform: 'scale(1)' },
              },
              scaleIn: {
                '0%': { transform: 'scale(0.9)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
              },
              shimmer: {
                '0%': { backgroundPosition: '-1000px 0' },
                '100%': { backgroundPosition: '1000px 0' }
              }
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #0f172a;
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
      }
      .font-arabic {
        font-family: 'Tajawal', sans-serif;
      }
      .glass-panel {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
